research_interests:
  - label: Relativistic Spin Dynamics
    text: Exploring non-minimal (and nonlinear) electromagnetism (EM) in quantum mechanics utilizing the Klein-Gordon-Pauli (KGP) equation, or classically via modifying the covariant Thomas-Bargmann-Michel-Telegdi (TBMT) torque equation.
  - label: Neutrino Physics
    text: EM mixing of neutrino flavor through transition magnetic dipole moments as a possible probe of the hierarchy problem. Exploring possible EM-induced neutrino mass splitting.
  - label: Cosmic Magnetization
    text: Magnetized spin-polarized thermal plasmas during the electron-positron and quark-gluon-plasma (QGP) epochs as a possible origin of primordial magnetic fields (PMF).

