# Grants and awards, newest first.
# Renders "{role}; PI: {pi}. {title}. {name}, {organization}, {amount}, {purpose} ({start}–{end})."
#
# id:           unique slug
# type:         grant (project funding) | travel (travel/meeting support) | award (prize, fellowship, honor)
# name, organization: required
# start, end:   YYYY or YYYY-MM; end omitted = single year/date (a one-time award)
# role:         your role, printed first, e.g. "Team member (lab design advisor)";
#               omit for awards you received outright
# pi:           "Surname, I." when someone else leads; "Steinmetz, A." (or role: PI) when it's you
# title:        project title, for grants
# amount:       number in USD, printed as "$21,250"
# purpose:      what it funded, e.g. "travel to *Event name*, City, Country"
# url:          announcement/program page, printed as a "Link"
# footnotes:    ids from footnotes.yml
# show: false hides an entry everywhere
# Inline markup: *italic*

